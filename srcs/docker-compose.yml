# services - for containers
# volumes - for persistent data
# networks - for internal communication

################################################################################
##                                                                            ##
##   INCEPTION DOCKER COMPOSE                                                 ##
##                                                                            ##
################################################################################

# Project name used as prefix for containers/networks/volumes
name: inception

services:

# -------------------------------------------------------------------------- #
# 1. MariaDB Database Server
# -------------------------------------------------------------------------- #
  mariadb:
   # Build from local Dockerfile
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    # Fixed container name instead of autogenerated
    container_name: mariadb
    image: inception_mariadb
    # Never pull from registry; always use local build
    pull_policy: never
    # Preventing corruption giving DB 60s to shut down gracefully
    stop_grace_period: 60s
    # Load all environment variables (passwords, db name, users) from .env
    env_file:
      - .env.example
    # Persist database files on host using the db_data volume
    volumes:
      - db_data:/var/lib/mysql
    # Connect to the custom bridge network
    networks:
      - inception
    # Auto-restart on crash or system reboot
    restart: always

# -------------------------------------------------------------------------- #
# 2. WordPress Application (PHP-FPM)
# -------------------------------------------------------------------------- #
  wordpress:
    # Build from local Dockerfile
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    # Fixed container name instead of autogenerated
    container_name: wordpress
    image: inception_wordpress
    # Never pull from registry; always use local build
    pull_policy: never
    # Load all environment variables (passwords, db name, users) from .env
    env_file:
      - .env.example
    # Share WordPress files with NGINX via the wp_data volume
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    # Ensure WordPress starts after MariaDB
    depends_on:
      - mariadb
    restart: always

# -------------------------------------------------------------------------- #
# 3. NGINX Web Server (Reverse Proxy + TLS)
# -------------------------------------------------------------------------- #
  nginx:
    # Build from local Dockerfile
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    # Fixed container name instead of autogenerated
    container_name: nginx
    image: inception_nginx
    # Never pull from registry; always use local build
    pull_policy: never
    env_file:
      - .env.example
    # Expose HTTPS to host. HOST_PORT:CONTAINER_PORT
    ports:
      - "443:443"
    # Access WordPress files in read-only to serve static files (css, js, images)
    volumes:
      - wp_data:/var/www/html:ro
    networks:
      - inception
    # Ensure NGINX starts after WordPress
    depends_on:
      - wordpress
    restart: always

# **************************************************************************** #
#    VOLUMES (Persistent Storage on Host)                                      #
# **************************************************************************** #

volumes:
  db_data:
    # Explicit volume name
    name: db_data
    # Using local filesystem driver
    driver: local
    # With no driver_options, Docker creates a managed volume under
    # /var/lib/docker/volumes/... and not a bind mount like we want
    driver_opts:
    # Volume type: none for local directory, nfs for NFS shares, etc.
      type: none
      # Host directory path
      device: /home/mcecchel/data/db_data
      # Mount option: bind mount
      o: bind

  wp_data:
    name: wp_data
    driver: local
    driver_opts:
      type: none
      # Host directory path
      device: /home/mcecchel/data/wp_data
      # Source: https://docs.docker.com/engine/storage/bind-mounts/
      o: bind

# **************************************************************************** #
#    NETWORKS                                                                  #
# **************************************************************************** #

# Network's driver (bridge = default option). Different options are:
  # - Host: container shares the host network namespace (no NAT, no port
  #   mapping); best performance/lowest overhead, but least isolation and
  #   can cause port conflicts.
  # - Bridge: containers on same Docker host talk to each other via an
  #   internal virtual network; supports DNS by service/container name;
  #   isolated from host LAN unless you publish ports.
  # - None: container gets no network interface (except loopback); fully
  #   isolated, useful for strict sandboxing.
  # - Overlay: connects containers/services across multiple Docker hosts.
  # - macvlan: container appears as a real device on your physical LAN with
  #   its own MAC/IP; useful when container must be directly reachable on
  #   LAN like a physical machine.
  # - ipvlan: similar goal to macvlan but shares MAC behavior differently.
networks:
  inception:
    # Bridge driver isolates the network from the host but allows containers
    # to communicate with each other using their container_names as DNS.
    driver: bridge
    # Explicit network name
    name: inception