################################################################################
##                                                                            ##
##   MARIADB CONFIGURATION FILE                                               ##
##                                                                            ##
################################################################################

# Options for the MariaDB daemon process
[mysqld]

# Run as unprivileged user "mysql" (default user created by the official MariaDB image)
user = mysql

# Directory where MariaDB stores its data files
datadir = /var/lib/mysql

# The standard port for MySQL/MariaDB
port = 3306
# bind-address: allows MariaDB to accept connections from any IP (= other containers)
# otherwise, it would only accept connections from himself
bind-address = 0.0.0.0
# To avoid TCP networking disabled from the default mariadb configurations
skip-networking = 0