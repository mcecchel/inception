################################################################################
##                                                                            ##
##   MARIADB CONFIGURATION FILE                                               ##
##                                                                            ##
################################################################################

# Options for the MariaDB daemon process
[mysqld]

# Run as unprivileged user "mysql" (default user created by the Debian mariadb-server package)
user = mysql

# Directory where MariaDB stores its data files
datadir = /var/lib/mysql

# The standard port for MySQL/MariaDB
port = 3306
# Allow connections from WordPress over the Docker network.
bind-address = 0.0.0.0