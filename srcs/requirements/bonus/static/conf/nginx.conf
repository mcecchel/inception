################################################################################
##                                                                            ##
##   STATIC WEBSITE - NGINX CONFIGURATION FILE (BONUS)                        ##
##                                                                            ##
################################################################################

# This NGINX only serves the static files. It is NOT published on the host: the
# main NGINX container is the only entrypoint (port 443) and proxies /thegame/ here.

events {
	worker_connections 1024;
}

http {
	# Send logs to stdout/stderr so `docker logs static` works
	access_log /dev/stdout;
	error_log /dev/stderr;

	server_tokens off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	server {
		# Internal port, reachable only inside the Docker network
		listen 8080;

		root /var/www/static;
		index index.html;

		location / {
			try_files $uri $uri/ =404;
		}
	}
}