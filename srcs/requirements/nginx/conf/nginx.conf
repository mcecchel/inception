################################################################################
##                                                                            ##
##   NGINX CONFIGURATION FILE                                                 ##
##                                                                            ##
################################################################################

events {
	# Maximum number of simultaneous connections handled by each worker process
	# Worker = running Nginx process that handles client requests
	worker_connections 1024;
}

# everything about web traffic
http {
	# Include MIME types for file extensions (like .html, .jpg, etc)
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	# one virtual server (one website)
	server {
		# Bind this virtual server to TCP port 443 with TLS
		listen 443 ssl;
		listen [::]:443 ssl;

		# Hostname
		server_name mcecchel.42.fr;

		# TLS certificate and private
		ssl_certificate		/etc/nginx/ssl/inception.crt;
		ssl_certificate_key	/etc/nginx/ssl/inception.key;

		# Supported protocols (TLS 1.2 and 1.3)
		ssl_protocols TLSv1.2 TLSv1.3;

		# Directory where Nginx looks for files (shared with the WordPress volume)
		root /var/www/html;
		# File served
		index index.php index.html index.htm;

		# Handling static requests
		location / {
			try_files $uri $uri/ /index.php?$args;
		}

		# Forwarding PHP files to the WordPress container via FastCGI (port 9000)
		location ~ \.php$ {
			fastcgi_split_path_info ^(.+\.php)(/.+)$;
			fastcgi_pass wordpress:9000;
			fastcgi_index index.php;
			include fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param PATH_INFO $fastcgi_path_info;
		}
	}
}
