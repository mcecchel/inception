################################################################################
##                                                                            ##
##   NGINX CONFIGURATION FILE                                                 ##
##                                                                            ##
################################################################################

events {
	# Maximum number of simultaneous connections handled by each worker process
	# Worker = running Nginx process that handles client requests
	worker_connections 1024;
}

# everything about web traffic
http {
	# Send logs to stdout/stderr so `docker logs nginx` works
	access_log /dev/stdout;
	error_log /dev/stderr;

	# Do not advertise the NGINX version
	server_tokens off;

	# Include MIME types for file extensions (like .html, .jpg, etc)
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	# one virtual server (one website)
	server {
		# Bind this virtual server to TCP port 443 with TLS
		listen 443 ssl;
		listen [::]:443 ssl;

		# Hostname
		server_name mcecchel.42.fr;

		# TLS certificate and private
		ssl_certificate		/etc/nginx/ssl/inception.crt;
		ssl_certificate_key	/etc/nginx/ssl/inception.key;

		# Supported protocols (TLS 1.2 and 1.3)
		ssl_protocols TLSv1.2 TLSv1.3;

		# Directory where Nginx looks for files (shared with the WordPress volume)
		root /var/www/html;
		# File served
		index index.php index.html index.htm;

		# Handling static requests
		location / {
			try_files $uri $uri/ /index.php?$args;
		}

		# Forwarding PHP files to the WordPress container via FastCGI (port 9000)
		location ~ \.php$ {
			fastcgi_split_path_info ^(.+\.php)(/.+)$;
			fastcgi_pass wordpress:9000;
			fastcgi_index index.php;
			include fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param PATH_INFO $fastcgi_path_info;
			fastcgi_param HTTP_HOST $http_host;
			
		}

		# Routing requests to the Adminer container (BONUS) via FastCGI (port 9000)
		location ~ ^/adminer(/.*$|$) {
			# Docker's embedded DNS server. It is needed because the upstream name is
			# stored in a variable below, so NGINX resolves it at request time.
			resolver 127.0.0.11 valid=10s ipv6=off;
			# With a literal "fastcgi_pass adminer:9000;" NGINX would resolve the name at
			# startup and refuse to start if the adminer container does not exist.
			# With a variable, the mandatory stack starts even without the bonus part:
			# /adminer just answers 502 until the adminer container is running.
			set $adminer_upstream adminer:9000;
			fastcgi_index index.php;
			include /etc/nginx/fastcgi_params;
			# Let NGINX know the exact path to the file INSIDE the adminer container
			fastcgi_param SCRIPT_FILENAME /var/www/adminer/adminer.php;
			fastcgi_pass $adminer_upstream;
		}

		# Static website container (BONUS), reached through the same NGINX entrypoint.
		# /thegame -> /thegame/ so that the relative links of the page (style.css...) work
		location = /thegame {
			absolute_redirect off;
			return 301 /thegame/;
		}

		# "^~" makes this prefix win over the regex locations above (\.php$, /adminer)
		location ^~ /thegame/ {
			# Same technique as /adminer: the name is in a variable, so it is resolved
			# at request time and NGINX starts even if the static container is not running
			resolver 127.0.0.11 valid=10s ipv6=off;
			set $static_upstream static:8080;
			# With a variable in proxy_pass NGINX does not remove the location prefix
			# by itself: the rewrite turns /thegame/x into /x ("break" = proxy right away)
			rewrite ^/thegame/(.*)$ /$1 break;
			proxy_pass http://$static_upstream;
		}
	}
}