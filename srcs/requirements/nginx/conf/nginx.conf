# NGINX configuration file
events {
	# Maximum number of simultaneous connections handled by each worker process
	# Worker = running Nginx process that handles client requests
	worker_connections 1024;
}

# everything about web traffic
http {
	# one virtual server (one website)
	server {
		# Bind this virtual server to TCP port 443 with TLS
		listen 443 ssl;

		# Hostname this server answers to
		server_name mcecchel.42.fr;

		# Server certificate and private key used for TLS handshake
		ssl_certificate		/etc/nginx/ssl/inception.crt;
		ssl_certificate_key	/etc/nginx/ssl/inception.key;

		# Restrict TLS negotiation to version 1.3 only
		ssl_protocols TLSv1.3;

		# Folder where Nginx looks for files (shared with the WordPress volume)
		root /var/www/html;

		# File served when the URL points to a folder, tried in this order
		index index.php index.html;

		# For every URL: serve the file if it exists, else try it as a folder,
		# else answer "404 not found"
		location / {
			try_files $uri $uri/ =404;
		}
	}
}