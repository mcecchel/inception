################################################################################
##                                                                            ##
##   WORDPRESS CONFIGURATION FILE                                             ##
##                                                                            ##
################################################################################

# Options for the PHP-FPM process
[www]

# Run as unprivileged user "www-data" (default user created by the official PHP-FPM image)
user = www-data
group = www-data

# Listen on TCP port 9000 instead of the default socket otherwise NGINX
# (which is in another container) won't be able to pass PHP files to it
listen = 9000

# By default, PHP-FPM clears all environment variables for security reasons, preventing
# WordPress from reading the passwords from .env file. Whit this option, we tell it not to do that
clear_env = no
