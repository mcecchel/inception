;*******************************************************************************
;;                                                                            ;;
;;   WORDPRESS CONFIGURATION FILE                                             ;;
;;                                                                            ;;
;*******************************************************************************

; Options for the PHP-FPM process
[www]

; Run as unprivileged user "www-data" (default user created by the Debian php-fpm package)
user = www-data
group = www-data

; Listen on TCP port 9000 instead of the default socket otherwise NGINX
; (which is in another container) won't be able to pass PHP files to it
listen = 9000

; By default, PHP-FPM clears all environment variables for security reasons, preventing
; WordPress from reading the passwords from .env file. With this option, we tell it not to do that
clear_env = no

; Use a managed worker pool so PHP-FPM can serve FastCGI requests continuously.
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3